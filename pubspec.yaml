name: kroscek_got_fet
description: "Standalone GOT and FET application for Kroscek."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  go_router: ^15.1.2
  camera: ^0.11.0+2
  crypto: ^3.0.7
  image_picker: ^1.1.2
  intl: ^0.20.2
  package_info_plus: ^8.0.0
  path_provider: ^2.1.5
  sensors_plus: ^6.1.1
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icon_foreground.png
    - assets/logo_got_fet.png
    - assets/logo_got.png
    - assets/logo_fet.png
    - assets/logo_got_fet_unbox.png
    - assets/logo_got_unbox.png
    - assets/logo_fet_unbox.png
    - assets/background.png
    - .env

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0d3a62"
  adaptive_icon_foreground: "assets/icon_foreground.png"
