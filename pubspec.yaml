name: kroscek_got_fet
description: "Standalone GOT and FET application for Kroscek."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  go_router: ^15.1.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.12.2

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icon_foreground.png
    - assets/logo_got_fet.png
    - assets/logo_got.png
    - assets/logo_fet.png
    - assets/logo_got_fet_unbox.png
    - assets/logo_got_unbox.png
    - assets/logo_fet_unbox.png
    - assets/background.png
    - .env
